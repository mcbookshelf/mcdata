name: ci
on:
  push:
    branches: [v1]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Generate and publish another Minecraft version than gradle.properties
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: resolve minecraft version
        id: version
        env:
          FORCED: ${{ inputs.version }}
        run: echo "version=${FORCED:-$(grep '^version=' gradle.properties | cut -d= -f2)}" >> "$GITHUB_OUTPUT"
      - name: run the data generators
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x ./gradlew
          ./gradlew run -Pversion="$VERSION"
      - name: upload generated data
        uses: actions/upload-artifact@v7
        with:
          name: generated
          path: generated/${{ steps.version.outputs.version }}/

  publish:
    needs: generate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.generate.outputs.version }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: setup git user
        uses: fregante/setup-git-user@v2
      - name: download generated data
        uses: actions/download-artifact@v7
        with:
          name: generated
          path: ${{ runner.temp }}/generated
      - name: tag generated data
        run: |
          # The tag holds only the data, the readme and the license
          git checkout -q --orphan data
          git rm -rfq .
          git checkout "$GITHUB_SHA" -- README.md LICENSE
          cp -r "$RUNNER_TEMP/generated/." .
          git add -A
          git commit -qm "🚀 Update generated contents for $VERSION"
          git tag -f "v1/$VERSION"
          git push -f origin "refs/tags/v1/$VERSION"
